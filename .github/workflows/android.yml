name: Build Leafra Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Leafra debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Gradle Wrapper
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar || {
            echo "::error::gradle-wrapper.jar 缺失，无法使用 ./gradlew 构建。"
            exit 1
          }
          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "::error::gradle-wrapper.properties 缺失，无法使用 ./gradlew 构建。"
            exit 1
          }
          chmod +x ./gradlew

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4.6.0
        with:
          name: leafra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
